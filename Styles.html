<style>
  /* ====================================================================
   * PROJETO: DOANDO CACHORROS (Inspirado no DoaDog)
   * ESTILOS VISUAIS MODERNOS E RESPONSIVOS (Styles.html)
   * ==================================================================== */

  :root {
    --primary: #1b8354;
    --primary-hover: #146641;
    --primary-light: #e8f5e9;
    --primary-surface: #f2f9f4;
    --accent: #e67e22;
    --accent-hover: #d35400;
    --accent-light: #fef5ea;
    --text-main: #24292f;
    --text-muted: #57606a;
    --text-light: #8c959f;
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;
    --border-focus: #1b8354;
    --status-available: #2e7d32;
    --status-available-bg: #e8f5e9;
    --status-process: #d97706;
    --status-process-bg: #fef3c7;
    --status-adopted: #64748b;
    --status-adopted-bg: #f1f5f9;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --shadow-hover: 0 12px 24px -4px rgba(27, 131, 84, 0.12), 0 6px 12px -2px rgba(0, 0, 0, 0.04);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 9999px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Reset & Box Sizing */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Focus visível para acessibilidade */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--border-focus);
    outline-offset: 2px;
  }

  /* Container Geral */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.25rem;
    width: 100%;
  }

  /* HEADER & HERO */
  .site-header {
    background: linear-gradient(135deg, #ffffff 0%, var(--primary-surface) 100%);
    border-bottom: 1px solid var(--border-color);
    padding: 2.5rem 0 2rem;
    text-align: center;
    position: relative;
    box-shadow: var(--shadow-sm);
  }

  .site-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background-color: #ffffff;
    padding: 0.5rem 1.25rem;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    margin-bottom: 1rem;
  }

  .site-brand-icon {
    font-size: 1.75rem;
    line-height: 1;
  }

  .site-title {
    font-size: 2.25rem;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .site-subtitle {
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .hero-text {
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--text-main);
    max-width: 680px;
    margin: 0 auto 0.75rem;
  }

  .hero-explanation {
    font-size: 0.92rem;
    color: var(--text-muted);
    max-width: 720px;
    margin: 0 auto;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 0.6rem 1.2rem;
    border-radius: var(--radius-md);
    border: 1px dashed #cbd5e1;
    display: inline-block;
  }

  /* BARRA DE FERRAMENTAS & FILTROS */
  .filter-section {
    background-color: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin: 2rem auto 1.5rem;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
  }

  .filter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.25rem;
    padding-bottom: 0.875rem;
    border-bottom: 1px solid var(--border-color);
  }

  .filter-heading-group {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .filter-heading-group h2 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    align-items: end;
  }

  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .filter-group.full-width-on-small {
    grid-column: 1 / -1;
  }

  @media (min-width: 768px) {
    .filter-group.full-width-on-small {
      grid-column: span 2;
    }
  }

  .filter-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  .input-with-icon {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-with-icon .input-icon {
    position: absolute;
    left: 0.875rem;
    color: var(--text-light);
    pointer-events: none;
    font-size: 0.95rem;
  }

  .filter-input, .filter-select {
    width: 100%;
    padding: 0.65rem 0.875rem;
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    color: var(--text-main);
    background-color: #ffffff;
    transition: var(--transition);
  }

  .input-with-icon .filter-input {
    padding-left: 2.25rem;
  }

  .filter-input:focus, .filter-select:focus {
    border-color: var(--border-focus);
    background-color: #ffffff;
  }

  .filter-actions {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
  }

  /* BOTÕES */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.625rem 1.25rem;
    border-radius: var(--radius-sm);
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: var(--transition);
    text-decoration: none;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background-color: var(--primary);
    color: #ffffff;
    box-shadow: 0 2px 4px rgba(27, 131, 84, 0.2);
  }

  .btn-primary:hover {
    background-color: var(--primary-hover);
  }

  .btn-outline {
    background-color: transparent;
    border-color: var(--border-color);
    color: var(--text-muted);
  }

  .btn-outline:hover {
    background-color: #f1f5f9;
    color: var(--text-main);
    border-color: #cbd5e1;
  }

  .btn-accent {
    background-color: var(--accent);
    color: #ffffff;
  }

  .btn-accent:hover {
    background-color: var(--accent-hover);
  }

  .btn-sm {
    padding: 0.4rem 0.85rem;
    font-size: 0.85rem;
  }

  /* STATUS BAR / CONTADOR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    padding: 0 0.25rem;
  }

  .results-count {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-main);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }

  .results-badge {
    background-color: var(--primary-light);
    color: var(--primary);
    padding: 0.2rem 0.65rem;
    border-radius: var(--radius-full);
    font-size: 0.88rem;
    font-weight: 700;
  }

  /* GRID DE CACHORROS */
  .dogs-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.75rem;
    margin-bottom: 3rem;
  }

  @media (min-width: 640px) {
    .dogs-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (min-width: 1024px) {
    .dogs-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  /* CARD DO CACHORRO */
  .dog-card {
    background-color: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    position: relative;
  }

  .dog-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: #bbf7d0;
  }

  .dog-card-image-wrapper {
    position: relative;
    width: 100%;
    height: 220px;
    background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dog-card-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  .dog-card:hover .dog-card-image {
    transform: scale(1.05);
  }

  /* Placeholder caso não tenha foto */
  .dog-placeholder-image {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #64748b;
    gap: 0.5rem;
  }

  .dog-placeholder-image svg {
    width: 56px;
    height: 56px;
    fill: currentColor;
    opacity: 0.7;
  }

  .dog-placeholder-image span {
    font-size: 0.85rem;
    font-weight: 500;
  }

  /* Badges flutuantes no card */
  .dog-status-tag {
    position: absolute;
    top: 0.85rem;
    right: 0.85rem;
    padding: 0.3rem 0.75rem;
    border-radius: var(--radius-full);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
  }

  .dog-status-available {
    background-color: rgba(46, 125, 50, 0.9);
    color: #ffffff;
  }

  .dog-status-process {
    background-color: rgba(217, 119, 6, 0.9);
    color: #ffffff;
  }

  .dog-status-adopted {
    background-color: rgba(100, 116, 139, 0.9);
    color: #ffffff;
  }

  .dog-card-body {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .dog-header {
    margin-bottom: 0.5rem;
  }

  .dog-name {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.25;
  }

  .dog-subtitle {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--primary);
    margin-top: 0.2rem;
  }

  .dog-meta-list {
    margin: 0.75rem 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-size: 0.88rem;
    color: var(--text-muted);
  }

  .dog-meta-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .dog-meta-item strong {
    color: var(--text-main);
    font-weight: 600;
  }

  .dog-description {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 1.25rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex-grow: 1;
  }

  .dog-card-footer {
    padding-top: 0.85rem;
    border-top: 1px solid var(--border-color);
  }

  .dog-card-footer .btn {
    width: 100%;
  }

  /* ESTADOS DE CARREGAMENTO & FEEDBACK */
  .state-container {
    text-align: center;
    padding: 4rem 1.5rem;
    background-color: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    margin: 2rem 0;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--primary-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1.25rem;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .state-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--text-main);
  }

  .state-message {
    color: var(--text-muted);
    max-width: 450px;
    margin: 0 auto 1.5rem;
    font-size: 0.95rem;
  }

  .state-error .state-title {
    color: #c53030;
  }

  /* MODAL DE DETALHES */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }

  .modal-backdrop.is-open {
    opacity: 1;
    visibility: visible;
  }

  .modal-dialog {
    background-color: var(--bg-card);
    border-radius: var(--radius-lg);
    max-width: 650px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    transform: scale(0.95);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .modal-backdrop.is-open .modal-dialog {
    transform: scale(1);
  }

  .modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background-color: var(--bg-card);
    z-index: 10;
  }

  .modal-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text-main);
  }

  .modal-close-btn {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.3rem;
    border-radius: var(--radius-sm);
    transition: var(--transition);
  }

  .modal-close-btn:hover {
    color: var(--text-main);
    background-color: #f1f5f9;
  }

  .modal-body {
    padding: 1.5rem;
  }

  .modal-image-wrapper {
    width: 100%;
    height: 280px;
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 1.5rem;
    background-color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .modal-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }

  .modal-tag {
    background-color: var(--primary-surface);
    color: var(--primary);
    padding: 0.35rem 0.85rem;
    border-radius: var(--radius-full);
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid #c6f6d5;
  }

  .modal-section-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 1.25rem 0 0.5rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--border-color);
  }

  .modal-description-text {
    font-size: 0.95rem;
    color: var(--text-main);
    line-height: 1.6;
    background-color: var(--primary-surface);
    padding: 1rem;
    border-radius: var(--radius-sm);
    border-left: 4px solid var(--primary);
  }

  .modal-details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.875rem;
    margin-top: 1rem;
  }

  .modal-detail-card {
    background-color: #f8fafc;
    padding: 0.75rem 1rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
  }

  .modal-detail-card .label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 0.2rem;
  }

  .modal-detail-card .value {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-main);
  }

  .modal-contact-box {
    margin-top: 1.5rem;
    background: linear-gradient(135deg, var(--accent-light) 0%, #fff7ed 100%);
    border: 1px solid #fed7aa;
    padding: 1.25rem;
    border-radius: var(--radius-md);
    text-align: center;
  }

  .modal-contact-box h3 {
    font-size: 1.05rem;
    color: var(--accent-hover);
    margin-bottom: 0.4rem;
  }

  .modal-contact-box p {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-main);
  }

  .modal-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: flex-end;
    background-color: #f8fafc;
    border-bottom-left-radius: var(--radius-lg);
    border-bottom-right-radius: var(--radius-lg);
  }

  /* FOOTER */
  .site-footer {
    background-color: #ffffff;
    border-top: 1px solid var(--border-color);
    padding: 2.5rem 0;
    margin-top: auto;
    text-align: center;
  }

  .footer-title {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--primary);
    margin-bottom: 0.35rem;
  }

  .footer-text {
    font-size: 0.88rem;
    color: var(--text-muted);
    max-width: 600px;
    margin: 0 auto;
  }

  .footer-credit {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-top: 1rem;
  }
</style>
